[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markovsound"
version = "0.1.0"
description = "Generative music system combining Markov chain text generation with ACE-Step diffusion"
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
markovsound = "markovsound.loop:main"
markovsound-absorb = "markovsound.cli_absorb:main"
markovsound-clean-caption-metadata = "markovsound.cli_clean_caption_metadata:main"
markovsound-dedup = "markovsound.cli_dedup:main"
markovsound-keep = "markovsound.cli_keep:main"
markovsound-lyricist = "markovsound.lyricist:main"
markovsound-prune-timestamps = "markovsound.cli_prune_timestamps:main"
markovsound-replace-lyrics = "markovsound.cli_replace_lyrics:main"
markovsound-seed-lyrics = "markovsound.cli_seed_lyrics:main"
markovsound-seed-vocal-tags = "markovsound.cli_seed_vocal_tags:main"
markovsound-steer = "markovsound.cli_steer:main"
markovsound-transcribe = "markovsound.cli_transcribe:main"
markovsound-understand = "markovsound.cli_understand:main"
markovsound-verwijder = "markovsound.cli_remove:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
