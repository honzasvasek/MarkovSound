[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markovsound"
version = "0.1.0"
description = "Generative music system combining Markov chain text generation with ACE-Step diffusion"
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
